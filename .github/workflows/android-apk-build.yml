name: Build Android APK

on:
  push:
    branches:
      - main # Triggers the build automatically when pushing code to main
  workflow_dispatch: # Allows you to manually click a button on GitHub to trigger a build anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Expo EAS Engine
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Uses your saved Expo token

      - name: Install dependencies
        run: npm install

      # Recreates the file securely right before compiling so Expo can see it!
      - name: Create google-services.json from GitHub Secret
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > google-services.json

      # Triggers the remote build using your preview APK profile configuration
      - name: Trigger EAS Android Preview Build (APK)
        run: eas build --platform android --profile preview --non-interactive